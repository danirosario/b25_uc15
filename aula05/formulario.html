<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--
    Formulário é uma seção de um documento que contém elementos interativos, como campos de entrada, botões, caixas de seleção, etc., que permitem aos usuários enviar informações para um servidor ou processar dados localmente.
    <form> </form> - Define um formulário HTML
    <input> </input> - Define um campo de entrada para o usuário
    <label> </label> - Define um rótulo para um elemento de formulário
    <button> </button> - Define um botão clicável
    -->

    <h1>Trabalhando com Formulários</h1>

    <form action="" method="post">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o Nome"><br>

        <label for="sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o Sobrenome"><br><br>

        <!-- Tipo radio -->
        <label for="">
            <strong>Qual seu nivel como programador:</strong><br>
        </label><br>

        <label for="nivelIniciante">
            <input type="radio" id="nivelIniciante" name="nivel" value="iniciante" checked> Iniciante
        </label>
        <label for="nivelIntermediario">
            <input type="radio" id="nivelIntermediario" name="nivel" value="intermediario"> Intermediário
        </label>
        <label for="nivelAvancado">
            <input type="radio" id="nivelAvancado" name="nivel" value="avancado"> Avançado
        </label>
        <br><br>

        <!-- Select -->

        <label for="">
            <strong>Escolaridade</strong><br>
        </label><br>

        <select id="escolaridade" name="escolaridade">
            <option selected disabled value="">Selecione...</option>
            <option value="basico">Ensino Básico</option>
            <option value="medio">Ensino Médio</option>
            <option value="superior">Ensino Superior</option>
            <option value="posGraduacao">Pós-Graduação</option>
        </select>

        <label for="">
            <strong>Selecione as tecnologias que você conhece</strong><br>
        </label><br>

        <input type="checkbox" id="html" name="tecnologia" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="tecnologia" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="tecnologia" value="javascript">
        <label for="javascript">JavaScript</label>

        <input type="checkbox" id="php" name="tecnologia" value="php">
        <label for="php">PHP</label>


        <!-- Botão de envio -->
        <br><br>
        <button type="submit">Enviar</button><br><br>


    </form>

</body>

</html>
