<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula06 CSS</title>
    <link rel="stylesheet" href="aula06_css/css/style.css">
</head>

<body>
    <!-- 
        > Classe (.nome-da-classe): Permite aplicar estilos a múltiplos elementos que compartilham a mesma classe.
        > ID (#nome-do-id): Aplica estilos a um elemento específico, identificado por um ID único.
        > Elemento (nome-do-elemento): Aplica estilos a todos os elementos de um tipo específico (por exemplo, p, h1, button).
        > Combinadores (elemento1 > elemento2, elemento1 + elemento2, elemento1 ~ elemento2): Permitem selecionar elementos com base em sua relação hierárquica ou de adjacência.
        > Pseudo-classes (elemento:pseudo-classe): Permitem aplicar estilos a elementos em um estado específico, como :hover, :focus, :nth-child(n), etc.

    -->
    <div id="container">
        <h1 class="titulo">Olá, Mundo!</h1>
        <p class="paragrafo">Este é um parágrafo de exemplo para demonstrar o uso de CSS.</p>
        <button class="botao">Clique aqui</button>
    </div>
</body>

</html>
