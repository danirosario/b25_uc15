<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica e Video</title>
</head>

<body>
    <h1>Trabalhando com música e vídeo</h1>

    <h2>Música</h2>

    <audio controls>
        <source src="music/Belle.mp3" type="audio/mpeg">
        Seu navegador não suporta este elemento de áudio.
    </audio>

    <h2>Vídeo</h2>

    <video width="320" height="240" controls poster="img/belle.jpg">
        <!-- Exibe uma imagem de capa antes do vídeo ser reproduzido -->
        <source src="video/Belle-video.mp4" type="video/mp4">
        Seu navegador não suporta este elemento de vídeo.
    </video>
</body>

</html>
