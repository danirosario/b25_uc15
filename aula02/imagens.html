<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>

<body>
    <h1>Trabalhando com imagens</h1>

    <h3>Imagem Externa</h3>

    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Senac_logo.svg/1280px-Senac_logo.svg.png" alt="Logo do Senac Guaratinguetá" width="200" height="100">
    <!--Exibe uma imagem com o atributo alt para acessibilidade-->

    <hr>

    <h3>Imagem Local</h3>

    <img src="img/fachada-senac-guaratingueta.jpg" alt="Senac Guaratinguetá" width="400" height="300">
</body>

</html>
