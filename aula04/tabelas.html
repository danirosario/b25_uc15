<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <!--
    Tabela é composta por linhas e colunas, onde as linhas são definidas por <tr> (table row) e as colunas são definidas por <td> (table data) ou <th> (table header).
    <tr> </tr> - Define uma linha da tabela (Row)
    <th> </th> - Define uma célula de cabeçalho (coluna) dentro de uma linha, geralmente usada para títulos de colunas
    <td> </td> - Define uma célula de dados (coluna) dentro de uma linha
    -->

    <h1>Trabalhando com Tabelas</h1>

    <table>
        <caption>Exemplo de Tabela</caption>
        <tr>
            <th>Ordem</th>
            <th>Serviço</th>
            <th>Preço</th>
            <th>Status</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Troca de Vidro</td>
            <td>R$ 600,00</td>
            <td>Em Andamento</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Limpeza de Ar Condicionado</td>
            <td>R$ 150,00</td>
            <td>Concluído</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Reparo de Motor</td>
            <td>R$ 1200,00</td>
            <td>Aguardando Peças</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Manutenção de Jardim</td>
            <td>R$ 200,00</td>
            <td>Em Andamento</td>
        </tr>
    </table>

</body>

</html>
